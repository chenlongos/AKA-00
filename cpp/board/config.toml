# AKA-00 机器人部署配置（cpp/ = 配置源）
# `make -C cpp package` 会把它拷贝进部署目录 cpp/dist/AKA-00/config.toml。
# 板上运行时实际读取的是 /root/AKA-00/config.toml。

[camera]
# 摄像头设备路径，运行时按前缀分流（一套二进制 Linux/Starry 通用）：
#   /dev/cvi-usb-camera0 → Starry 私有 ioctl；/dev/video* → Linux V4L2。
# 本板跑 Starry；纯 Linux 机器改成 "/dev/video0"（所配节点缺失时程序也会自动回退到另一个）。
port = "/dev/cvi-usb-camera0"
# 采集分辨率：必须用摄像头原生能出帧的档位。
# 实测本摄像头（Hy-UXGA/B5M2）：320x240 会"假协商不出帧"（勿用！），640x360 可稳定出流。
# 枚举到的全部档位：1920x1080 1280x960 1280x720 640x360（320x240 为假档）
width = 640
height = 360
# 采集帧率：单核 C906 上"有新帧才推"→ 采集 30fps 比 15fps 多出约 15% 出流帧率
# （15fps 时取流只能等到 1/15s 才可能有新帧）。
fps = 30
jpeg_quality = 75
# 浏览器取流方式（CPU ↔ 带宽 的权衡，按机器负载选）：
#   stream_scale = false：**直通原帧** —— 摄像头出的就是压缩好的 MJPEG，服务端
#     零解码零编码。代价是带宽大：640x360 q75 原帧实测约 37KB/帧。
#   stream_scale = true（默认，课堂多车推荐）：服务端把采集帧缩到
#     stream_width x stream_height 并重编码后下发。单车实测：
#     直通 ~4.2Mbps → 288x162 q80 ~1.07Mbps @20.6fps，30 台同房间时总带宽从
#     120Mbps+ 降到 ~32Mbps。
#   **出流帧率主要由像素数决定**（单核上解码+缩放+编码都按像素线性增长），
#   stream_quality 几乎不影响帧率（q50~q88 相差 <1fps）。实测（采集30fps）：
#     320x180 q75 → 16.1fps / 0.89Mbps（解码就要 320x180）
#     288x162 q80 → 20.6fps / 1.07Mbps（解码仍是 320x180，编码按 288x162）
#     256x144 q88 → 23.1fps / 1.25Mbps（解码降到 160x90，画面偏软）
#   想要更流畅就往下调尺寸（下限 256x144），要更清晰就往上调（上限 400x225）。
#   **注意**：必须同时把 [display] fps_streaming 设成 0，否则屏显示解码会和
#     浏览器取流抢单核 CPU —— 实测 fps_streaming=3 时缩放出流只有 4fps。
#   jpeg_quality 当前 C++ 实现未使用（板子走 CVI 私有摄像头路径，拿不到 UVC 质量
#     控制），改它不会生效。
stream_scale = true
stream_width = 288
stream_height = 162
stream_quality = 80
# 固定曝光/AWB/增益（默认 false）：廉价 UVC 的自动曝光/AWB 会周期性抖动，
# 整幅画面每帧一起变 → 屏显示的脏行检测失效（写屏流量上升、帧率下降）。
# 开启后画面亮度恒定（暗光下会偏暗）；等价于板测工具 tests/demo_camera.c 的 DEMO_EXP_FIX=1。
exp_fix = false

[motor]
backend = "tt_pid"
port = "/dev/ttyS1"
baudrate = 115200
ppr = 4680
# 左右电机接线标定（每台车一份，默认全 false）。首选还是断电把底盘电机插头/线序
# 归位（硬件标定，全车队一致）；不方便开壳时才用下面两个软件开关（可叠加）。
# 现象 → 怎么设：
#   前进后退正常、只有左右转反    → swap_lr = true
#   前进后退反、 左右转也反      → invert = true
#   前进后退反、 左右转正常      → swap_lr = true 且 invert = true
# config.toml 在 OTA --update 时会被保留，所以这个标定不会被升级冲掉。
swap_lr = false
invert = false

[arm]
backend = "zp10s"
port = "/dev/ttyS2"
baudrate = 115200

[web]
port = 80
https_port = 443
https_cert = "cert.pem"
https_key = "key.pem"

[ota]
check_url = "https://api.chenlongrobot.com/api/user/robot-versions/featured"

[chassis]
wheel_diameter_mm = 62
gear_ratio = 90

[logging]
level = "info"

[blockly]
# Opt in for one automatic attempt per boot, pinned to this exact uploaded package.
# The marker lives in /tmp (tmpfs); restarting aka-capp must not repeat motion.
autorun_enabled = false
autorun_program_id = ""
startup_timeout_ms = 30000

# ── 板载 SPI 屏实时显示（摄像头画面 → /dev/fb0）──
# 屏板：ST7796S 320x480 RGB565，SPI 接口。写屏带宽是硬瓶颈：
#   出厂 4MHz ≈ 420KB/s（约 2fps）→ 设备树 spi-max-frequency 提到 20MHz ≈ 2MB/s
#   （该板实测 24MHz 起白屏，20MHz 是稳定上限）。
# 显示线程与浏览器 /api/camera/stream 共享同一份解码结果（Camera::latest_rgb 缓存），
# 因此开屏不会拖慢浏览器看摄像头的速度/效率；无 /dev/fb0 时自动跳过，不影响服务。
[display]
# 屏显示总开关。false = 整个显示栈不启动（无 /dev/fb0 的板子会自动跳过，不用改这里）
enabled = true
# 屏跟随摄像头开关 —— **固定行为，不是配置项**（所以这里没有对应的键）：
#   开机（摄像头关）→ 屏显示熄屏待机图；打开摄像头 → 切实时画面；关闭 → 回到待机图。
#   屏状态对前端透明，也没有任何 HTTP 接口。
# 显示区域 = 屏幕 1/scale
#   1 → 全屏 320x480（默认；307KB/帧，写满时受 SPI 带宽限制约 8fps）
#   2 → 半屏 160x240 居中（75KB/帧，可吃满摄像头帧率；嫌全屏卡就改回 2）
# 画面按「旋转 90° + cover 缩放居中裁切」铺满显示区：不拉伸变形，全屏会裁掉约 16% 的上下边
scale = 1
# 方向修正：0无 1水平翻 2垂直翻 3=180°（本板实测 3 为正）
orient = 3
# 显示帧率上限。全屏一帧 307KB，SPI 实际约 23.44MHz（≈2.4MB/s）→ 写满整屏上限约 8fps；
# 再高只会让内核里的推送队列积压（画面延迟变大，而不是更流畅）。改回半屏（scale=2）可提到 15
fps = 8
# 浏览器有人在看 MJPEG 流时的显示帧率（0 = 暂停显示）。
# 单核 SoC 上"全屏写屏 + 浏览器取流"会抢 CPU（每帧 RGB565 转换约 28ms + 内核推屏），
# 有人看流时降到 3 帧（浏览器优先），没人看时恢复 fps。
# 默认 0（暂停）：配合 [camera] stream_scale 才能跑满 11~13fps；屏停在最后一帧，
# 浏览器断开后立即恢复正常显示。
fps_streaming = 0
# 解码降采样上限宽。全屏要铺满 320x480，按 640 解码才清晰（按 320 解码会被放大 1.78 倍、
# 明显发虚）；半屏（scale=2）时用 320 更省 CPU，也能与浏览器共用同一次解码
decode_max_w = 640
# 熄屏待机图（摄像头关 / 屏停用时显示的画面，替代纯黑清屏）
#   路径 —— 相对路径按 $AKA_HOME 解析（打包后在应用根目录）；留空 = 保持黑屏
#   铺法 —— 总是铺满整屏（不受 scale 影响）；图与面板同比例最好：
#           start_img.jpg 是 480x320，旋转后正好 1:1，不裁不补
standby_image = "start_img.jpg"
