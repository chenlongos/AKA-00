# AKA-00 机器人部署配置（cpp/ = 配置源）
# `make -C cpp package` 会把它拷贝进部署目录 cpp/dist/AKA-00/config.toml。
# 板上运行时实际读取的是 /root/AKA-00/config.toml。

[camera]
# 采集分辨率：必须用摄像头原生能出帧的档位。
# 实测本摄像头（Hy-UXGA/B5M2）：320x240 会"假协商不出帧"（勿用！），640x360 可稳定出流。
# 枚举到的全部档位：1920x1080 1280x960 1280x720 640x360（320x240 为假档）
width = 640
height = 360
fps = 15
jpeg_quality = 75
# 流式下发缩放（省 WiFi 带宽）：
# stream_scale = true（默认）时，/api/camera/stream 把采集帧缩到
# stream_width x stream_height 重编码后下发；
# stream_scale = false 时直通原帧（更清晰、带宽更大）。
stream_scale = true
stream_width = 320
stream_height = 180
stream_quality = 75
# 固定曝光/AWB/增益（默认 false）：廉价 UVC 的自动曝光/AWB 会周期性抖动，
# 整幅画面每帧一起变 → 屏显示的脏行检测失效（写屏流量上升、帧率下降）。
# 开启后画面亮度恒定（暗光下会偏暗）；= demo 的 DEMO_EXP_FIX=1。
exp_fix = false

[motor]
backend = "tt_pid"
port = "/dev/ttyS1"
baudrate = 115200
ppr = 4680

[arm]
backend = "zp10s"
port = "/dev/ttyS2"
baudrate = 115200

[web]
port = 80
https_port = 5443
https_cert = "cert.pem"
https_key = "key.pem"

[ota]
check_url = "https://api.chenlongrobot.com/api/user/robot-versions/featured"

[chassis]
wheel_diameter_mm = 62
gear_ratio = 90

[logging]
level = "info"

# ── 板载 SPI 屏实时显示（摄像头画面 → /dev/fb0）──
# 屏板：ST7796S 320x480 RGB565，SPI 接口。写屏带宽是硬瓶颈：
#   出厂 4MHz ≈ 420KB/s（约 2fps）→ 设备树 spi-max-frequency 提到 20MHz ≈ 2MB/s
#   （该板实测 24MHz 起白屏，20MHz 是稳定上限）。
# 显示线程与浏览器 /api/camera/stream 共享同一份解码结果（Camera::latest_rgb 缓存），
# 因此开屏不会拖慢浏览器看摄像头的速度/效率；无 /dev/fb0 时自动跳过，不影响服务。
[display]
enabled = true
# 屏显示跟随摄像头开关（默认 true）：
#   开机摄像头是关的 → 屏保持黑不出图；打开摄像头（前端开关 / POST /api/camera/open）
#   → 屏开始显示；关闭摄像头（POST /api/camera/close）→ 屏清屏熄灭。
# 设为 false = 开机就常显（会顺带打开摄像头，旧行为）。
follow_camera = true
# 显示区域 = 屏幕 1/scale：2 → 160x240 居中（推荐，75KB/帧，可吃满摄像头帧率）
#                        1 → 全屏 320x480（307KB/帧，受 SPI 带宽限制约 8fps）
scale = 2
# 方向修正：0无 1水平翻 2垂直翻 3=180°（本板实测 3 为正）
orient = 3
# 显示帧率上限（与 [camera] fps 对齐即可）
fps = 15
# 浏览器有人在看 MJPEG 流时的显示帧率（默认 5；0 = 暂停显示）。
# 单核 SoC 上"屏显示 + 浏览器取流"会 CPU 饱和：显示每帧 RGB565 转换 + SPI 写屏
# 约 20ms（15fps ≈ 30% 单核），会明显拖慢网页看摄像头的帧率与延迟。
# 有人看流时屏幕降到该帧率（浏览器优先），没人看时自动恢复 fps。
fps_streaming = 5
# 脏行检测容差：忽略 RGB565 每通道 N 个 LSB（实况有传感器噪声，0=精确会"全行都变"）
noise = 1
# 解码降采样上限宽（与 [camera] stream_width 一致 → 与浏览器共用同一次解码）
decode_max_w = 320
