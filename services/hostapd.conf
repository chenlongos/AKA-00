# 基本接口与驱动
interface=wlan0
driver=nl80211

# SSID与唯一性：通过MAC地址后缀确保每个开发板热点名称不同
ssid=chenlong-rk3576-test

# 频段与模式
hw_mode=g
channel=6  # 启用自动信道选择(ACS)，避开干扰

# 安全与认证：保持开放认证
auth_algs=1

# 其他性能与可靠性优化
ieee80211n=1  # 启用802.11n，提升速率
wmm_enabled=1  # 启用WMM，提升多媒体性能，对n/ac/ax模式很重要
max_num_sta=20  # 限制最大连接数，防止过多设备挤占带宽（根据需要调整）
beacon_int=100  # 信标间隔，默认100（单位ms），调整此值可能影响省电和连接速度
dtim_period=1  # DTIM周期，影响组播/广播传输，默认1

