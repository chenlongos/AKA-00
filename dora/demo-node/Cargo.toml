[package]
name = "demo-node"
version = "0.1.0"
edition = "2021"

[dependencies]
dora-config = { path = "../dora-config" }
dora-node-api = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "time"] }
eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arrow = "54"
log = "0.4"
env_logger = "0.11"
libc = "0.2"