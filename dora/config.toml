# dora 机器人配置文件
# 对应 app/config.py 的 HardwareConfig

[camera]
width = 320
height = 240
fps = 24
jpeg_quality = 30

[motor]
# 底盘驱动类型："dev" (开发模式), "tt_pid" (真实硬件)
backend = "tt_pid"
port = "/dev/ttyS1"
baudrate = 115200
ppr = 4680

[arm]
# 机械臂驱动类型："dev" (开发模式), "zp10s" (真实硬件)
backend = "zp10s"
port = "/dev/ttyS2"
baudrate = 115200

[web]
port = 80
https_port = 5443

[ota]
check_url = "https://api.chenlongrobot.com/api/user/robot-versions/featured"

[chassis]
# 底盘物理参数 — 用于把编码器 RPM 换算成线速度 m/s
# 1:90 减速比对应 PPR=4680（TT 马达典型值，base_control.ino 固件）
wheel_diameter_mm = 62
gear_ratio = 90

[logging]
# 日志级别: error / warn / info / debug / trace
# info —— 生命周期 + 错误（默认）
# debug —— 加上 set_speeds / GET_STATUS / TX-RX hex 帧（5Hz 刷屏）
# trace —— 同 debug + 内部解析细节
# 想临时覆盖可用环境变量 RUST_LOG（如 RUST_LOG=motor_bridge=debug）
level = "info"
