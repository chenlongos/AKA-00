nodes:
  - id: camera
    build: make -C camera-node
    path: camera-node/camera-node
    inputs:
      tick: dora/timer/millis/42
      control: web-server/control
    outputs:
      - image

  - id: motor-bridge
    build: cargo build -p motor-bridge --release
    path: target/release/motor-bridge
    inputs:
      motor_cmd: web-server/motor_cmd
    outputs:
      - motor_status

  - id: arm-bridge
    build: cargo build -p arm-bridge --release
    path: target/release/arm-bridge
    inputs:
      arm_cmd: web-server/arm_cmd
    outputs:
      - arm_status

  - id: state-node
    build: cargo build -p state-node --release
    path: target/release/state-node
    inputs:
      motor_status: motor-bridge/motor_status
      arm_status: arm-bridge/arm_status
      motor_cmd: web-server/motor_cmd
      arm_cmd: web-server/arm_cmd
    outputs:
      - robot_state

  - id: web-server
    build: cargo build -p web-server --release
    path: target/release/web-server
    inputs:
      image: camera/image
      robot_state: state-node/robot_state
    outputs:
      - control
      - motor_cmd
      - arm_cmd